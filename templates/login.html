{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4 data-th="เข้าสู่ระบบ" data-en="Login">เข้าสู่ระบบ</h4>
            </div>
            <div class="card-body">
                <form method="POST">
                    {{ form.hidden_tag() }}
                    <div class="mb-3">
                        <label class="form-label fw-bold" data-th="ชื่อผู้ใช้ (Username)" data-en="Username">ชื่อผู้ใช้ (Username)</label>
                        {{ form.username(class="form-control", autofocus=True) }}
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold" data-th="รหัสผ่าน (Password)" data-en="Password">รหัสผ่าน (Password)</label>
                        {{ form.password(class="form-control") }}
                    </div>
                    <div class="d-grid gap-2">
                        <button type="submit" class="btn btn-primary" data-th="เข้าสู่ระบบ" data-en="Login">เข้าสู่ระบบ</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-center">
                <small>
                    <span data-th="ยังไม่มีบัญชี?" data-en="Don't have an account?">ยังไม่มีบัญชี?</span> 
                    <a href="/register" data-th="สมัครสมาชิก" data-en="Register">สมัครสมาชิก</a>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
