{% extends "base.html" %}
{% block content %}

<style>
    /* =======================================================
       CSS จัดการให้พอดีหน้าจอ (Responsive & Prevent Overflow)
       ======================================================= */
    
    /* ป้องกันกรอบโดยรวมล้น */
    #quiz-container {
        max-width: 100%;
        overflow-x: hidden; /* ห้ามให้ทั้งหน้าเว็บมี Scrollbar แนวนอน */
    }

    /* จัดการข้อความในโจทย์ */
    #question-text {
        word-wrap: break-word;
        word-break: break-word;
    }

    /* จัดการภาพให้ย่อ-ขยายตามหน้าจออัตโนมัติ */
    #image-container img {
        max-width: 100%;
        height: auto !important;
        object-fit: contain;
    }

    /* จัดการปุ่มตัวเลือกให้ตัดบรรทัดและไม่ล้นขอบ */
    .choice-btn {
        white-space: normal !important; 
        word-wrap: break-word;
        word-break: break-word;
        text-align: left !important;
        width: 100%;
        height: auto !important;
        line-height: 1.6;
    }

    /* กรณีสมการคณิตศาสตร์ (LaTeX) ยาวมากๆ จนล้นหน้าจอ 
       ให้มี Scrollbar เลื่อนซ้ายขวาได้เฉพาะที่ตัวสมการเท่านั้น */
    mjx-container {
        max-width: 100%;
        overflow-x: auto;
        overflow-y: hidden;
    }
</style>

<div id="quiz-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3 class="text-truncate pe-2">
            <span class="text-secondary">[{{ subject }}]</span> <span class="text-primary">{{ topic }}</span>
        </h3>
        <span class="badge bg-secondary fs-6 text-nowrap" id="q-progress">
            <span data-th="ข้อที่" data-en="Question">ข้อที่</span> 1/{{ max_q }}
        </span>
    </div>
    
    <div class="card shadow-sm w-100">
        <div class="card-body px-3 py-4">
            <div id="error-alert" class="alert alert-danger" style="display:none;"></div>
            
            <h5 class="card-title mb-4 fw-bold" id="question-text" style="line-height: 1.8;">Loading...</h5>
            
            <div id="image-container" class="text-center mb-4"></div>
            
            <div id="choices-area" class="d-grid gap-3"></div>
            
            <div class="mt-4 text-end">
                <button id="next-btn" class="btn btn-primary btn-lg" style="display:none;" onclick="loadQuestion()" data-th="ข้อถัดไป &raquo;" data-en="Next &raquo;">ข้อถัดไป &raquo;</button>
            </div>
        </div>
        <div class="card-footer text-muted d-flex justify-content-between flex-wrap">
            <span>
                <span data-th="ระดับความยาก:" data-en="Difficulty Level:">ระดับความยาก:</span> 
                <span id="diff-display" class="fw-bold">-</span>
            </span>
            <small>Adaptive Mode</small>
        </div>
    </div>
</div>

<div id="result-container" style="display:none;" class="text-center mt-5 w-100">
    <h3 data-th="🎉 สรุปผลการทดสอบ" data-en="🎉 Quiz Results">🎉 สรุปผลการทดสอบ</h3>
    <p class="fs-4">
        <span data-th="คะแนนเฉลี่ยความยาก:" data-en="Average Difficulty Score:">คะแนนเฉลี่ยความยาก:</span> 
        <span id="final-score" class="fw-bold text-primary"></span>
    </p>
    
    <div class="row justify-content-center mt-4">
        <div class="col-12 col-md-10 col-lg-8">
            <h5 class="text-muted mb-3" data-th="สถิติการตอบถูก/ผิด แบ่งตามระดับความยาก" data-en="Correct/Incorrect Stats by Difficulty">สถิติการตอบถูก/ผิด แบ่งตามระดับความยาก</h5>
            <canvas id="resultChart" style="max-width: 100%;"></canvas>
        </div>
    </div>

    <a href="/" class="btn btn-primary mt-4 btn-lg px-5" data-th="กลับหน้าหลัก" data-en="Back to Home">กลับหน้าหลัก</a>
</div>

<script>
    const sessionId = {{ session_id }};
    const subject = "{{ subject }}";
    const topic = "{{ topic }}";
    const maxQ = {{ max_q }};
    let currentQId = null;
    let currentMapping = [];
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

    function loadQuestion() {
        document.getElementById('next-btn').style.display = 'none';
        
        fetch('/api/get_question', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({ session_id: sessionId, subject: subject, topic: topic })
        })
        .then(res => res.json())
        .then(data => {
            if (data.status === 'finished' || data.progress > maxQ) { finishQuiz(); return; }
            
            // อัปเดตข้อความต่างๆ
            document.getElementById('q-progress').innerText = `${t('ข้อที่', 'Question')} ${data.progress}/${maxQ}`;
            document.getElementById('question-text').innerText = data.text;
            document.getElementById('diff-display').innerText = data.difficulty;
            
            // แสดงรูปภาพ Base64
            const imgContainer = document.getElementById('image-container');
            if(data.image_data) {
                imgContainer.innerHTML = `<img src="${data.image_data}" class="img-fluid rounded shadow-sm">`;
            } else { 
                imgContainer.innerHTML = ''; 
            }

            currentQId = data.q_id;
            currentMapping = data.mapping_indices;
            const choicesDiv = document.getElementById('choices-area');
            choicesDiv.innerHTML = '';
            
            data.choices.forEach((choice, visualIndex) => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-outline-dark text-start py-3 px-4 fs-5 choice-btn';
                
                // [สำคัญ] ใช้ innerText เพื่อป้องกันเครื่องหมาย < กลายเป็นแท็ก HTML
                btn.innerText = choice; 
                
                btn.onclick = () => submitAnswer(visualIndex, btn);
                choicesDiv.appendChild(btn);
            });
            
            // สั่งให้ MathJax เรนเดอร์สมการ
            if (window.MathJax) MathJax.typesetPromise();
        })
        .catch(err => {
            console.error(err);
            const errDiv = document.getElementById('error-alert');
            errDiv.style.display = 'block';
            errDiv.innerText = t('เกิดข้อผิดพลาดในการโหลดข้อสอบ', 'Failed to load question.');
        });
    }

    function submitAnswer(visualIndex, btnElement) {
        // ปิดปุ่มทั้งหมดกันกดซ้ำ
        document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
        
        fetch('/api/submit_answer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({ session_id: sessionId, q_id: currentQId, choice_idx: currentMapping[visualIndex] })
        })
        .then(res => res.json())
        .then(data => {
            // แสดงสี ถูก/ผิด
            btnElement.style.backgroundColor = data.correct ? '#198754' : '#dc3545';
            btnElement.style.color = 'white';
            btnElement.style.borderColor = data.correct ? '#198754' : '#dc3545';
            
            document.getElementById('next-btn').style.display = 'inline-block';
        })
        .catch(err => {
            console.error(err);
            const errDiv = document.getElementById('error-alert');
            errDiv.style.display = 'block';
            errDiv.innerText = t('เกิดข้อผิดพลาดในการส่งคำตอบ', 'Failed to submit answer.');
        });
    }

    function finishQuiz() {
        fetch('/api/finish_session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({ session_id: sessionId })
        })
        .then(res => res.json())
        .then(data => {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            document.getElementById('final-score').innerText = data.avg_score.toFixed(2);
            renderResultChart(data.stats);
        });
    }

    function renderResultChart(stats) {
        const ctx = document.getElementById('resultChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Level 1', 'Level 2', 'Level 3', 'Level 4', 'Level 5'],
                datasets: [
                    { 
                        label: t('ตอบถูก (Correct)', 'Correct'), 
                        data: [stats[1].cor, stats[2].cor, stats[3].cor, stats[4].cor, stats[5].cor], 
                        backgroundColor: '#198754' 
                    },
                    { 
                        label: t('ตอบผิด (Incorrect)', 'Incorrect'), 
                        data: [stats[1].wro, stats[2].wro, stats[3].wro, stats[4].wro, stats[5].wro], 
                        backgroundColor: '#dc3545' 
                    }
                ]
            },
            options: { 
                responsive: true, 
                scales: { 
                    x: { stacked: true }, 
                    y: { stacked: true, beginAtZero: true, ticks: { stepSize: 1 } } 
                } 
            }
        });
    }
    
    // เริ่มโหลดข้อสอบทันที
    loadQuestion();
</script>
{% endblock %}
