{% extends "base.html" %}
{% block content %}
<div id="quiz-container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3><span class="text-secondary">[{{ subject }}]</span> <span class="text-primary">{{ topic }}</span></h3>
        <span class="badge bg-secondary fs-6" id="q-progress"><span data-th="ข้อที่" data-en="Question">ข้อที่</span> 1/{{ max_q }}</span>
    </div>
    <div class="card shadow-sm">
        <div class="card-body">
            <div id="error-alert" class="alert alert-danger" style="display:none;"></div>
            
            <h5 class="card-title my-3" id="question-text" style="line-height: 1.8;">Loading...</h5>
            <div id="image-container" class="text-center mb-3"></div>
            
            <div id="choices-area" class="d-grid gap-2 mt-4"></div>
            <div class="mt-4 text-end">
                <button id="next-btn" class="btn btn-primary btn-lg" style="display:none;" onclick="loadQuestion()" data-th="ข้อถัดไป &raquo;" data-en="Next &raquo;">ข้อถัดไป &raquo;</button>
            </div>
        </div>
        <div class="card-footer text-muted d-flex justify-content-between">
            <span><span data-th="ระดับความยาก:" data-en="Difficulty Level:">ระดับความยาก:</span> <span id="diff-display" class="fw-bold">-</span></span>
            <small>Adaptive Mode</small>
        </div>
    </div>
</div>

<div id="result-container" style="display:none;" class="text-center mt-5">
    <h3 data-th="🎉 สรุปผลการทดสอบ" data-en="🎉 Quiz Results">🎉 สรุปผลการทดสอบ</h3>
    <p class="fs-4"><span data-th="คะแนนเฉลี่ยความยาก:" data-en="Average Difficulty Score:">คะแนนเฉลี่ยความยาก:</span> <span id="final-score" class="fw-bold text-primary"></span></p>
    
    <div class="row justify-content-center mt-4">
        <div class="col-md-8">
            <h5 class="text-muted mb-3" data-th="สถิติการตอบถูก/ผิด แบ่งตามระดับความยาก" data-en="Correct/Incorrect Stats by Difficulty">สถิติการตอบถูก/ผิด แบ่งตามระดับความยาก</h5>
            <canvas id="resultChart"></canvas>
        </div>
    </div>

    <a href="/" class="btn btn-primary mt-4 btn-lg" data-th="กลับหน้าหลัก" data-en="Back to Home">กลับหน้าหลัก</a>
</div>

<script>
    const sessionId = {{ session_id }};
    const subject = "{{ subject }}";
    const topic = "{{ topic }}";
    const maxQ = {{ max_q }};
    let currentQId = null;
    let currentMapping = [];
    const csrfToken = document.querySelector('meta[name="csrf-token"]').getAttribute('content');

    function loadQuestion() {
        document.getElementById('next-btn').style.display = 'none';
        fetch('/api/get_question', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({ session_id: sessionId, subject: subject, topic: topic })
        }).then(res => res.json()).then(data => {
            if (data.status === 'finished' || data.progress > maxQ) { finishQuiz(); return; }
            
            // อัปเดตข้อความผสมฟังก์ชัน t()
            document.getElementById('q-progress').innerText = `${t('ข้อที่', 'Question')} ${data.progress}/${maxQ}`;
            document.getElementById('question-text').innerText = data.text;
            document.getElementById('diff-display').innerText = data.difficulty;
            
            const imgContainer = document.getElementById('image-container');
            if(data.image_data) {
                imgContainer.innerHTML = `<img src="${data.image_data}" class="img-fluid rounded shadow-sm" style="max-height: 300px;">`;
            } else { imgContainer.innerHTML = ''; }

            currentQId = data.q_id;
            currentMapping = data.mapping_indices;
            const choicesDiv = document.getElementById('choices-area');
            choicesDiv.innerHTML = '';
            
            data.choices.forEach((choice, visualIndex) => {
                const btn = document.createElement('button');
                btn.className = 'btn btn-outline-dark text-start py-2 fs-5 choice-btn';
                btn.innerHTML = choice;
                btn.onclick = () => submitAnswer(visualIndex, btn);
                choicesDiv.appendChild(btn);
            });
            if (window.MathJax) MathJax.typesetPromise();
        });
    }

    function submitAnswer(visualIndex, btnElement) {
        document.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
        fetch('/api/submit_answer', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({ session_id: sessionId, q_id: currentQId, choice_idx: currentMapping[visualIndex] })
        }).then(res => res.json()).then(data => {
            btnElement.style.backgroundColor = data.correct ? '#198754' : '#dc3545';
            btnElement.style.color = 'white';
            document.getElementById('next-btn').style.display = 'inline-block';
        });
    }

    function finishQuiz() {
        fetch('/api/finish_session', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
            body: JSON.stringify({ session_id: sessionId })
        }).then(res => res.json()).then(data => {
            document.getElementById('quiz-container').style.display = 'none';
            document.getElementById('result-container').style.display = 'block';
            document.getElementById('final-score').innerText = data.avg_score.toFixed(2);
            renderResultChart(data.stats);
        });
    }

    function renderResultChart(stats) {
        const ctx = document.getElementById('resultChart').getContext('2d');
        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Level 1', 'Level 2', 'Level 3', 'Level 4', 'Level 5'],
                datasets: [
                    { label: t('ตอบถูก (Correct)', 'Correct'), data: [stats[1].cor, stats[2].cor, stats[3].cor, stats[4].cor, stats[5].cor], backgroundColor: '#198754' },
                    { label: t('ตอบผิด (Incorrect)', 'Incorrect'), data: [stats[1].wro, stats[2].wro, stats[3].wro, stats[4].wro, stats[5].wro], backgroundColor: '#dc3545' }
                ]
            },
            options: { responsive: true, scales: { x: { stacked: true }, y: { stacked: true, beginAtZero: true, ticks: { stepSize: 1 } } } }
        });
    }
    loadQuestion();
</script>
{% endblock %}
