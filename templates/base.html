<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    
    <title>Adaptive Exercise System</title>
    
    <!-- เพิ่ม Google Fonts (Sarabun) เพื่อแก้ปัญหาสระลอย/จม บน Mac และแสดงผลให้เหมือนกันทุกเครื่อง -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;700&display=swap" rel="stylesheet">
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        /* บังคับใช้ฟอนต์ Sarabun ทั้งเว็บ */
        body {
            font-family: 'Sarabun', sans-serif;
        }
        
        /* แก้ปัญหาข้อความทะลุปุ่ม (Bug 1) */
        .choice-btn {
            white-space: normal !important; /* บังคับให้ตัดบรรทัด */
            word-wrap: break-word;          /* ตัดคำที่ยาวเกินไป */
            text-align: left !important;    /* ชิดซ้ายให้อ่านง่าย */
            height: auto !important;        /* ให้ความสูงยืดตามข้อความ */
            line-height: 1.6;               /* ระยะห่างบรรทัดให้อ่านง่าย */
            padding-top: 0.75rem !important;
            padding-bottom: 0.75rem !important;
        }
    </style>

    <script>
    window.MathJax = { tex: { inlineMath: [['\\(', '\\)']] }, svg: { fontCache: 'global' } };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/" data-th="ระบบแบบฝึกหัดอัจฉริยะ" data-en="Adaptive Exercise System">ระบบแบบฝึกหัดอัจฉริยะ</a>
            
            <div class="ml-auto d-flex align-items-center">
                <button class="btn btn-outline-light btn-sm me-3 fw-bold" onclick="toggleLanguage()" id="langToggleBtn">EN</button>

                {% if current_user.is_authenticated %}
                    <span class="me-3 text-white" id="nav-greeting" data-th="สวัสดี, {{ current_user.username }}" data-en="Hello, {{ current_user.username }}">สวัสดี, {{ current_user.username }}</span>
                    <a href="/profile" class="btn btn-sm btn-outline-light me-2" data-th="โปรไฟล์" data-en="Profile">โปรไฟล์</a>
                    <a href="/logout" class="btn btn-sm btn-danger" data-th="ออกจากระบบ" data-en="Logout">ออกจากระบบ</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-info">{{ messages[0] }}</div>
            {% endif %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <!-- ระบบแปลภาษา -->
    <script>
        let currentLang = localStorage.getItem('appLang') || 'th';

        function toggleLanguage() {
            currentLang = currentLang === 'th' ? 'en' : 'th';
            localStorage.setItem('appLang', currentLang);
            applyLanguage();
        }

        function applyLanguage() {
            const btn = document.getElementById('langToggleBtn');
            if (btn) btn.innerText = currentLang === 'th' ? 'EN' : 'TH';

            const elements = document.querySelectorAll('[data-th][data-en]');
            elements.forEach(el => {
                if (currentLang === 'en') {
                    if (el.tagName === 'INPUT' && el.hasAttribute('placeholder')) {
                        el.placeholder = el.getAttribute('data-en');
                    } else {
                        el.innerHTML = el.getAttribute('data-en');
                    }
                } else {
                    if (el.tagName === 'INPUT' && el.hasAttribute('placeholder')) {
                        el.placeholder = el.getAttribute('data-th');
                    } else {
                        el.innerHTML = el.getAttribute('data-th');
                    }
                }
            });
        }

        window.t = function(th_text, en_text) {
            return currentLang === 'en' ? en_text : th_text;
        };

        document.addEventListener('DOMContentLoaded', applyLanguage);
    </script>
</body>
</html>
